name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # No real secrets: AI runs in deterministic fallback mode and PayPal is mocked in E2E.
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      AI_FORCE_FALLBACK: "1"
      PAYPAL_ENV: sandbox
      PAYPAL_CLIENT_ID: ci-client-id
      PAYPAL_CLIENT_SECRET: ci-client-secret
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ci-client-id
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: PostgreSQL schema in sync
        run: node scripts/sync-postgres-schema.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npx prisma db push --skip-generate && npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Desktop and Mobile)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
